stages:
  - build
  - deploy

variables:
  CI_REGISTRY: docker.io #registry.gitlab.com
  CI_REGISTRY_IMAGE: xtradot/abiapay-pos-portal
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

services:
  - docker:24.0.6-dind

# CI Stage
test:
  stage: test
  image: node:24-alpine
  # only:
  #   - dev
  #   - main
  script:
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
    - npm audit


# Build and push to repo
docker_build:
  stage: build
  image: docker:latest
  services:
    - docker:24.0.6-dind
  only:
    - main
  before_script:
    - echo "Building Docker image..."
    - echo -n $ENV_FILE | base64 -d > .env
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build . -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE:latest --target production
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Tagging Docker image with Git tag..."
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  after_script:
    - rm .env
    - docker logout

deploy_sandbox:
  image: jomoflash/cicd-utils:v1
  stage: deploy
  only:
    - dev
  script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_KEY" | base64 -d)
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST '
        set -e &&
        echo "Loading NVM..." &&
        export NVM_DIR="$HOME/.nvm" &&
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" &&
        export PATH="$(yarn global bin):$PATH" &&
        echo "Checking Node.js version..." &&
        echo "node $(node -v)" &&
        echo "npm $(npm -v)" &&
        echo "yarn $(yarn -v)" &&
        cd /opt/deployment/abia/abiapay-pos-portal &&
        echo -e "\n Pulling latest changes from GitLab..." &&
        git fetch origin &&
        git reset --hard &&
        git checkout $CI_COMMIT_REF_NAME &&
        git pull &&
        echo -e "\n Installing dependencies..." &&
        yarn install &&
        yarn build &&
        echo "Restarting app..." &&
        pm2 reload abiapay-pos-portal &&
        echo "Deployment successful!" &&
        exit'
    - eval $(ssh-add -D)
  environment:
    name: sandbox
    url: pos.abiaone.com


# Deploy to production
deploy_prod:
  stage: deploy
  only:
    - main
  image: jomoflash/cicd-utils:v1
  before_script:
    - install -m 600 -D /dev/null ~/.kube/config
    - echo -n $CI_KUBECONFIG | base64 -d > ~/.kube/config
  script:
    - envsubst < manifest.tmpl > manifest.yaml
    - kubectl apply -f manifest.yaml
  after_script:
    - rm -rf ~/.kube
  environment:
    name: Hydrogen.abiapay.com
